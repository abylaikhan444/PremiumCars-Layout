<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <article class="news-card">
        <img src="/image/cars/MERS.png" alt="McLaren">
        <div class="card-body">
        <span class="badge">Vehicle</span>
        <h2>One of Saturn's...</h2>
        <p class="meta">Rickie...</p>
        <p>Sed ut perspiciatis...</p>
        </div>
    </article>
    <style>
        .news-card {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #4fc3f7;
        }
        .news-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block; /* убирает inline gap */
        }
        .card-body {
            background: white;
            
            padding: 1.25rem;
            margin-top: -24px; /* ← ключевой трюк */
            border-radius: 12px 12px 0 0;
            position: relative; /* выше картинки по z-index */
        }
    </style>
</body>
</html>
